<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>食物選擇器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6750a4;
      --on-primary: #ffffff;
      --surface: #f4f4f4;
      --on-surface: #1c1b1f;
      --outline: #79747e;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--surface);
      color: var(--on-surface);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 24px;
      color: var(--primary);
    }

    .container {
      max-width: 500px;
      padding: 16px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--outline);
      resize: none;
      margin-top: 12px;
    }

    button {
      margin: 8px 4px;
      padding: 10px 16px;
      border: none;
      border-radius: 24px;
      background-color: var(--primary);
      color: var(--on-primary);
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #7f67be;
    }

    #wheelContainer {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto 10px;
    }

    .wheelImage {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform: rotate(0deg);
      transition: transform 5s cubic-bezier(0.33, 1, 0.68, 1);
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid red;
      z-index: 10;
    }

    #optionList {
      margin-top: 20px;
      font-size: 14px;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      color: green;
    }
  </style>
</head>
<body>
  <h1>食物選擇器</h1>
  <div class="container">
    <textarea id="optionInput" placeholder="輸入選項（每行一個）"></textarea>
    <div>
      <button onclick="addOptions()">新增</button>
      <button onclick="clearOptions()">清除</button>
      <button onclick="spinWheel()">轉盤</button>
    </div>
    <div id="wheelContainer">
      <div class="pointer"></div>
      <img id="wheelImage" class="wheelImage" src="wheel_image.jpg" alt="轉盤">
    </div>
    <div id="result"></div>
    <div id="optionList"></div>
  </div>

  <script>
    let options = [];
    let currentRotation = 0;
    const wheelImg = document.getElementById("wheelImage");

    function loadOptions() {
      const stored = localStorage.getItem('options');
      if (stored) options = JSON.parse(stored);
      renderOptions();
    }

    function saveOptions() {
      localStorage.setItem('options', JSON.stringify(options));
    }

    function addOptions() {
      const input = document.getElementById("optionInput").value.trim();
      if (!input) return;
      const newItems = input.split('\n').map(o => o.trim()).filter(o => o);
      options.push(...newItems);
      saveOptions();
      document.getElementById("optionInput").value = '';
      renderOptions();
    }

    function clearOptions() {
      if (confirm('確定清除所有選項？')) {
        options = [];
        saveOptions();
        renderOptions();
        document.getElementById("result").textContent = '';
      }
    }

    function renderOptions() {
      const list = document.getElementById("optionList");
      list.innerHTML = `<strong>目前選項：</strong><br>${options.map((o, i) => `${i + 1}. ${o}`).join('<br>') }`;
    }

    function spinWheel() {
      if (options.length === 0) {
        alert("請先新增選項！");
        return;
      }
      const fullSpins = 5;
      const degreesPerOption = 360 / options.length;
      const selectedIndex = Math.floor(Math.random() * options.length);
      const rotateTo = (360 - selectedIndex * degreesPerOption) + fullSpins * 360;
      currentRotation += rotateTo;
      wheelImg.style.transform = `rotate(${currentRotation}deg)`;
      setTimeout(() => {
        document.getElementById("result").textContent = `結果：${options[selectedIndex]}`;
      }, 5000);
    }

    loadOptions();
  </script>
</body>
</html>
