<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>多人共用輪盤</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
      color: #1c1b1f;
      text-align: center;
      padding: 20px;
    }
    textarea {
      width: 100%;
      max-width: 500px;
      height: 100px;
      margin-top: 10px;
    }
    button {
      margin: 5px;
      padding: 10px 16px;
      border: none;
      border-radius: 24px;
      background-color: #6750a4;
      color: white;
      cursor: pointer;
    }
    canvas {
      margin-top: 20px;
    }
    .result {
      font-size: 20px;
      margin-top: 16px;
      color: green;
    }
  </style>
</head>
<body>
  <h1>多人即時共用輪盤</h1>
  <textarea id="optionInput" placeholder="輸入選項，每行一個"></textarea><br>
  <button onclick="addOptions()">新增</button>
  <button onclick="clearOptions()">清除</button>
  <button onclick="spinWheel()">轉輪</button>
  <canvas id="wheel" width="300" height="300"></canvas>
  <div class="result" id="result"></div>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDN4FPMp2NS3hTDVpKgyjXJS-zQIbTbmn8",
      authDomain: "food-chosen-55cc7.firebaseapp.com",
      databaseURL: "https://food-chosen-55cc7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "food-chosen-55cc7",
      storageBucket: "food-chosen-55cc7.firebasestorage.app",
      messagingSenderId: "385832095858",
      appId: "1:385832095858:web:b4fe177e6b15291c3af2eb"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let options = [];
    let spinning = false;
    let startAngle = 0;
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const radius = canvas.width / 2;

    function drawWheel() {
      const arc = 2 * Math.PI / options.length;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < options.length; i++) {
        const angle = startAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = `hsl(${(i * 360 / options.length)}, 70%, 70%)`;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.fill();
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.fillStyle = "#000";
        ctx.textAlign = "right";
        ctx.font = "bold 14px Roboto";
        ctx.fillText(options[i], radius - 10, 5);
        ctx.restore();
      }
    }

    function renderOptionsFromDB(snapshot) {
      const data = snapshot.val();
      options = Array.isArray(data) ? data : [];
      drawWheel();
    }

    // 初始化監聽資料庫
    db.ref("options").on("value", renderOptionsFromDB);

    function addOptions() {
      const input = document.getElementById("optionInput").value.trim();
      if (!input) return;
      const newItems = input.split("\n").map(o => o.trim()).filter(o => o);
      const updatedOptions = [...options, ...newItems];
      db.ref("options").set(updatedOptions);
      document.getElementById("optionInput").value = '';
    }

    function clearOptions() {
      if (confirm("確定要清除所有選項？")) {
        db.ref("options").set([]);
        document.getElementById("result").textContent = '';
      }
    }

    function spinWheel() {
      if (spinning || options.length === 0) return;
      spinning = true;
      const spinAngle = Math.random() * 360 + 1440; // 多圈
      const duration = 5000;
      let startTime = null;

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentAngle = (spinAngle * easeOut) * Math.PI / 180;
        startAngle = currentAngle % (2 * Math.PI);
        drawWheel();
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          spinning = false;
          showResult();
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult() {
      const arc = 2 * Math.PI / options.length;
      const selectedIndex = Math.floor((2 * Math.PI - startAngle + arc / 2) % (2 * Math.PI) / arc) % options.length;
      const selectedOption = options[selectedIndex];
      document.getElementById("result").textContent = `結果：${selectedOption}`;
    }
  </script>
</body>
</html>
