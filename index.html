<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>食物選擇器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
      color: #1c1b1f;
      text-align: center;
      padding: 20px;
    }
    textarea {
      width: 100%;
      max-width: 500px;
      height: 100px;
      margin-top: 10px;
    }
    button {
      margin: 5px;
      padding: 10px 16px;
      border: none;
      border-radius: 24px;
      background-color: #9faafc;
      color: white;
      cursor: pointer;
    }
    #wheelContainer {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto 10px;
    }
    .wheelImage {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform: rotate(0deg);
      transition: transform 5s cubic-bezier(0.33, 1, 0.68, 1);
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid red;
      z-index: 10;
    }
    .result {
      font-size: 20px;
      margin-top: 16px;
      color: green;
    }
    #optionList {
      max-width: 500px;
      margin: 24px auto;
      background-color: #444;
      color: white;
      border-radius: 10px;
      padding: 12px;
      text-align: left;
    }
    .option-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #666;
    }
    .option-item:last-child {
      border-bottom: none;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #9faafc;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Material You 對話框樣式 */
    #confirmDialog {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
    }
    .dialog-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.3);
    }
    .dialog-box {
      position: relative;
      background: white;
      color: #1c1b1f;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 80%;
      width: 300px;
      text-align: center;
      z-index: 1;
      animation: scaleIn 0.3s ease;
    }
    .dialog-text {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .dialog-buttons {
      display: flex;
      justify-content: space-around;
    }
    .dialog-btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .dialog-btn.cancel {
      background-color: #e0e0e0;
      color: #333;
    }
    .dialog-btn.confirm {
      background-color: #9faafc;
      color: white;
    }
    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>食物選擇器</h1>
  <textarea id="optionInput" placeholder="輸入選項，每行一個"></textarea><br>
  <button onclick="addOptions()">新增</button>
  <button onclick="clearOptions()">清除</button>
  <button onclick="spinWheel()">轉盤</button>

  <div id="wheelContainer">
    <div class="pointer"></div>
    <img id="wheelImage" class="wheelImage" src="wheel_image.jpg" alt="轉盤圖片">
  </div>

  <div class="result" id="result"></div>
  <div id="optionList"><strong>目前選項：</strong><div id="optionItems"></div></div>

  <!-- Material You 確認對話框 -->
  <div id="confirmDialog">
    <div class="dialog-overlay"></div>
    <div class="dialog-box">
      <div class="dialog-text" id="dialogMessage">你確定要刪除嗎？</div>
      <div class="dialog-buttons">
        <button class="dialog-btn cancel" onclick="closeDialog()">取消</button>
        <button class="dialog-btn confirm" id="confirmDeleteBtn">刪除</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDN4FPMp2NS3hTDVpKgyjXJS-zQIbTbmn8",
      authDomain: "food-chosen-55cc7.firebaseapp.com",
      databaseURL: "https://food-chosen-55cc7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "food-chosen-55cc7",
      storageBucket: "food-chosen-55cc7.firebasestorage.app",
      messagingSenderId: "385832095858",
      appId: "1:385832095858:web:b4fe177e6b15291c3af2eb"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let options = [];
    let currentRotation = 0;
    const wheelImg = document.getElementById("wheelImage");

    db.ref("options").on("value", snapshot => {
      const data = snapshot.val();
      options = Array.isArray(data) ? data : [];
      renderOptionList();
    });

    function renderOptionList() {
      const container = document.getElementById("optionItems");
      container.innerHTML = "";
      options.forEach((option, index) => {
        const div = document.createElement("div");
        div.className = "option-item";
        div.innerHTML = `<span>${option}</span>
                         <button class="delete-btn" onclick="deleteOption(${index})">刪除</button>`;
        container.appendChild(div);
      });
    }

    function addOptions() {
      const input = document.getElementById("optionInput").value.trim();
      if (!input) return;
      const newItems = input.split("\n").map(o => o.trim()).filter(o => o && !options.includes(o));
      const updatedOptions = [...options, ...newItems];
      db.ref("options").set(updatedOptions);
      document.getElementById("optionInput").value = '';
    }

    function clearOptions() {
      if (confirm("確定要清除所有選項？")) {
        db.ref("options").set([]);
        document.getElementById("result").textContent = '';
      }
    }

    function spinWheel() {
      if (options.length === 0) {
        alert("請先新增選項！");
        return;
      }
      const fullSpins = 5;
      const degreesPerOption = 360 / options.length;
      const selectedIndex = Math.floor(Math.random() * options.length);
      const rotateTo = (360 - selectedIndex * degreesPerOption) + fullSpins * 360;
      currentRotation += rotateTo;
      wheelImg.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        document.getElementById("result").textContent = `結果：${options[selectedIndex]}`;
      }, 5000);
    }

    // Material You 對話框邏輯
    let deleteIndex = null;

    function deleteOption(index) {
      deleteIndex = index;
      document.getElementById("dialogMessage").textContent = `確定要刪除「${options[index]}」嗎？`;
      document.getElementById("confirmDialog").style.display = "flex";
    }

    function closeDialog() {
      document.getElementById("confirmDialog").style.display = "none";
      deleteIndex = null;
    }

    document.getElementById("confirmDeleteBtn").onclick = function () {
      if (deleteIndex !== null) {
        const updatedOptions = [...options];
        updatedOptions.splice(deleteIndex, 1);
        db.ref("options").set(updatedOptions);
      }
      closeDialog();
    };
  </script>
</body>
</html>
