<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>食物選擇器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
      color: #1c1b1f;
      text-align: center;
      padding: 20px;
    }
    textarea {
      width: 100%;
      max-width: 500px;
      height: 100px;
      margin-top: 10px;
    }
    button {
      margin: 5px;
      padding: 10px 16px;
      border: none;
      border-radius: 24px;
      background-color: #6750a4;
      color: white;
      cursor: pointer;
    }
    #wheelContainer {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto 10px;
    }
    .wheelImage {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform: rotate(0deg);
      transition: transform 5s cubic-bezier(0.33, 1, 0.68, 1);
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid red;
      z-index: 10;
    }
    .result {
      font-size: 20px;
      margin-top: 16px;
      color: green;
    }
  </style>
</head>
<body>
  <h1>食物選擇器</h1>
  <textarea id="optionInput" placeholder="輸入選項，每行一個"></textarea><br>
  <button onclick="addOptions()">新增</button>
  <button onclick="clearOptions()">清除</button>
  <button onclick="spinWheel()">轉盤</button>

  <div id="wheelContainer">
    <div class="pointer"></div>
    <img id="wheelImage" class="wheelImage" src="wheel_image.jpg" alt="轉盤圖片">
  </div>

  <div class="result" id="result"></div>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDN4FPMp2NS3hTDVpKgyjXJS-zQIbTbmn8",
      authDomain: "food-chosen-55cc7.firebaseapp.com",
      databaseURL: "https://food-chosen-55cc7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "food-chosen-55cc7",
      storageBucket: "food-chosen-55cc7.firebasestorage.app",
      messagingSenderId: "385832095858",
      appId: "1:385832095858:web:b4fe177e6b15291c3af2eb"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let options = [];
    let currentRotation = 0;
    const wheelImg = document.getElementById("wheelImage");

    // 讀取資料庫中的選項
    db.ref("options").on("value", snapshot => {
      const data = snapshot.val();
      options = Array.isArray(data) ? data : [];
    });

    function addOptions() {
      const input = document.getElementById("optionInput").value.trim();
      if (!input) return;
      const newItems = input.split("\n").map(o => o.trim()).filter(o => o);
      const updatedOptions = [...options, ...newItems];
      db.ref("options").set(updatedOptions);
      document.getElementById("optionInput").value = '';
    }

    function clearOptions() {
      if (confirm("確定要清除所有選項？")) {
        db.ref("options").set([]);
        document.getElementById("result").textContent = '';
      }
    }

    function spinWheel() {
      if (options.length === 0) {
        alert("請先新增選項！");
        return;
      }
      const fullSpins = 5;
      const degreesPerOption = 360 / options.length;
      const selectedIndex = Math.floor(Math.random() * options.length);
      const rotateTo = (360 - selectedIndex * degreesPerOption) + fullSpins * 360;
      currentRotation += rotateTo;
      wheelImg.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        document.getElementById("result").textContent = `結果：${options[selectedIndex]}`;
      }, 5000);
    }
  </script>
</body>
</html>
